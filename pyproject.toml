[project]
name = "smartdeskaiassistant"
version = "0.1.0"
description = "Moxa — a multi-agent (LangGraph) HR & IT help-desk assistant for Synergy Inc with hybrid RAG and Jira ticketing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastembed>=0.9.1",
    "jira>=3.10.5",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.19",
    "langsmith>=0.14.16",
    "pydantic>=2.14.2",
    "streamlit>=1.66.1",
]

[project.scripts]
moxa = "smartDeskAi.main:main"
moxa-ui = "smartDeskAi.launch_ui:run"
moxa-hash-password = "smartDeskAi.auth:main"
moxa-eval-routing = "smartDeskAi.evaluation.routing_eval:main"
moxa-kb-phrasings = "smartDeskAi.tools.kb_phrasings:main"
moxa-eval-retrieval = "smartDeskAi.evaluation.retrieval_eval:main"
moxa-eval-answers = "smartDeskAi.evaluation.answer_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartDeskAi"]
